spring.application.name=statistics
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5433/statistics
spring.datasource.username=statistics
spring.datasource.password=statistics
spring.jpa.hibernate.ddl-auto=update
statistics.kafka.redirect-topic=link-redirected
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=statistics
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.urlshortener.statistics.event.LinkRedirected
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.urlshortener.statistics.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=false